services:
  db:
    image: postgres:16-alpine
    container_name: salonbook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: salonbook
      POSTGRES_USER: salonbook
      POSTGRES_PASSWORD: salonbook_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: